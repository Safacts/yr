<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YR Corporation - Product Submission</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #ecf6fe, #fcf6e0);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #ffffff, #ffffff);
            color: #333;
            padding: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 2rem;
        }

        .product-form-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: linear-gradient(135deg, #ffffff, #ffffff);
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
        }

        .product-form-container h2 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            height: 40px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            background-color: #f0f0f0;
        }

        .form-group textarea {
            height: auto;
        }

        .file-upload {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            margin: 0 auto;
        }
        
        .file-upload input[type="file"] {
            width: 100%;
            padding: 20px;
            font-size: 16px;
            border: 2px dashed #ccc;
            border-radius: 20px;
            outline: none;
            background-color: #f9f9f9;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }
        
        .file-upload input[type="file"]:hover {
            border-color: #ff4d4d;
            background-color: #ffe6e6;
        }
        
        .file-upload input[type="file"]::-webkit-file-upload-button {
            display: none;
        }
        
        .file-upload::before {
            content: 'Drag or Select a File';
            display: block;
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }
        
        .file-upload input[type="file"]::file-selector-button {
            background-image: linear-gradient(135deg, #ff4d4d, #ff8080, #ff9a9e, #fbc2eb, #a6c1ee);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        
        .file-upload input[type="file"]::file-selector-button:hover {
            background-color: #ff9a9e;
            transform: scale(1.05);
        }

        .form-group button {
            padding: 12px 24px;
            background: linear-gradient(90deg, #ff4d4d, #ff8080, #ff9a9e, #fbc2eb, #a6c1ee);
            background-size: 400% 400%;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.5s ease;
            animation: gradientShift 5s infinite alternate;
        }

        .form-group button:hover {
            animation: gradientMove 2s linear infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .message {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #333;
        }
    </style>
</head>
<body>
    {% comment %} <header class="header">
        <h1>Submit Your Product</h1>
    </header> {% endcomment %}

    <div class="product-form-container">
        <h2>Submit New Product</h2>
        <form id="productForm" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="productName">Product Name:</label>
                <input type="text" id="productName" name="productName" required />
            </div>
            <div class="form-group">
                <label for="productDescription">Product Description:</label>
                <textarea id="productDescription" name="productDescription" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="productPrice">Price:</label>
                <input type="number" id="productPrice" name="productPrice" required />
            </div>
            <div class="form-group file-upload">
                <input type="file" id="productImage" name="productImage" accept="image/*" required/>
            </div>
            <div class="form-group">
                <button type="submit">Submit Product</button>
            </div>
        </form>
        <div class="message" id="formMessage"></div>
    </div>
    
    <script>
        document.getElementById("productForm").addEventListener("submit", async function (e) {
            e.preventDefault();
    
            let formData = new FormData(this);
    
            const getCookie = (name) => {
                let cookieValue = null;
                if (document.cookie && document.cookie !== '') {
                    const cookies = document.cookie.split(';');
                    for (let i = 0; cookies.length > i; i++) {
                        const cookie = cookies[i].trim();
                        if (cookie.substring(0, name.length + 1) === (name + '=')) {
                            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                            break;
                        }
                    }
                }
                return cookieValue;
            };
            const csrftoken = getCookie('csrftoken');
    
            let response = await fetch("{% url 'submit_product' %}", {
                method: "POST",
                body: formData,
                headers: {
                    'X-CSRFToken': csrftoken
                }
            });
    
            let result = await response.json();
            if (response.ok) {
                document.getElementById("formMessage").innerText = result.message;
                this.reset();
            } else {
                if (result.error && result.error.message === 'The resource already exists') {
                    document.getElementById("formMessage").innerText = "Product already exists.";
                } else {
                    document.getElementById("formMessage").innerText = result.error?.message || "An error occurred.";
                }
            }
        });
    </script>
    
        
</body>
</html>
