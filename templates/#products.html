<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #fff;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
  
      .products {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;  /* Adjusted to display 3 cards per row */
        padding: 20px;
        margin-bottom: 50px;
      }
      
      .product-card {
        background-color: #fff;
        border-radius: 10px;
        overflow: hidden;
        transition: transform 0.3s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: calc(23% - 20px);
        margin: 1%;
        animation: fade-in 1s ease-out both;
        position: relative; /* Added for button positioning */
        height: 540px; /* Fixed height for product cards */
      }
  
      .product-card img {
        width: 100%;
        height: 390px; /* Fixed height for images */
        object-fit: contain; /* Ensures images cover the space without stretching */
      }
  
      .product-info {
        padding: 35px; /* Responsible for product description height adjustment */
        text-align: left;
        height: 150px; /* Fixed height for product info */
      }
  
      .product-info h3 {
        margin-top: 0;
        margin-bottom: 5px;
        font-size: 1.3rem;
        color: #333;
      }
  
      .product-info p {
        margin: 0;
        color: #666;
        font-size: 0.9rem;
      }
  
      .product-info button {
        background-color: #333;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        position: absolute; /* Added for button positioning */
        bottom: 15px; /* Move button up from bottom edge */
        right: 15px; /* Adjust horizontal position if needed */
      }
  
      .product-info button:hover {
        background-color: #444;
      }
  
      @keyframes fade-in {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
<body>
 
  <h2>Product List</h2>
  <div style="display: flex; flex-wrap: wrap;">
      {% for product in products %}
          <div class="product-card">
              <img src="{{ product.image_url }}" alt="{{ product.name }}">
              <h3>{{ product.name }}</h3>
              <p>{{ product.description }}</p>
              <p><strong>Price:</strong> ${{ product.price }}</p>
          </div>
      {% empty %}
          <p>No products available.</p>
      {% endfor %}
  </div>

<script>
        function redirectToWhatsApp(phoneNumber) {
            // Construct the WhatsApp URL with your phone number
            var whatsappURL = 'https://wa.me/' + phoneNumber;
            
            // Open the WhatsApp URL in a new tab
            window.open(whatsappURL, '_blank');
        }


        const products = [
          // ... your keychain data (objects with name, image URL, price)
        ];

        let displayedProducts = []; // Initially empty

        function displayProducts(products) {
          // Generate HTML for each product and append it to the .products container
          // ... your existing logic for product card creation
          displayedProducts = displayedProducts.concat(products); // Update displayed products
        }

        function loadNewProducts() {
          const newProducts = products.filter(product => !displayedProducts.includes(product)); // Filter out displayed
          const nextProducts = newProducts.slice(0, 6); // Get the next 6 products
          displayProducts(nextProducts);
        }

        window.addEventListener('scroll', function() {
          const isNearBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 100;

          if (isNearBottom && newProducts.length > 0) {
            loadNewProducts();
          }
        });

        displayProducts(products.slice(0, 6)); // Initial load

        displayProducts(products);
    </script>
</body>
</html>
